<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout | The Cookery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1C1A;
    --ink-soft:#6B6862;
    --paper:#FAF8F3;
    --paper-alt:#F5F1E8;
    --indigo-deep:#18352B;
    --accent:#18352B;
    --accent-dark:#132A22;
    --green:#4B9C6D;
    --line:rgba(28,28,26,.14);
    --line-soft:rgba(28,28,26,.08);
    --radius:3px;
    --radius-card:4px;
    --shadow-cta:0 8px 20px -6px rgba(24,53,43,.5);
    --display:'DM Serif Display', serif;
    --body:'Inter', sans-serif;
    --mono:'Inter', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--body);background:var(--paper-alt);color:var(--ink);-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}
  h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.01em;}

  header{background:var(--indigo-deep);border-bottom:1px solid rgba(255,255,255,.08);padding:16px 24px;position:sticky;top:0;z-index:60;}
  .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:9px;color:#fff;font-family:var(--display);font-weight:400;font-size:1.15rem;}
  .logo-mark{width:30px;height:30px;border-radius:50%;border:1.5px solid #4B9C6D;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-mark svg{width:16px;height:16px;stroke:#7FC79A;}
  .logo-text{display:flex;flex-direction:column;line-height:1;}
  .logo-text .the{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:3px;}
  .logo-text .cookery{font-style:italic;color:#5FB07E;font-size:19px;}
  .secure-tag{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.7);}
  .secure-tag svg{width:14px;height:14px;color:var(--accent);}

  main{max-width:1100px;margin:0 auto;padding:40px 24px 100px;}
  .checkout-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:start;}
  @media(max-width:900px){
    .checkout-grid{grid-template-columns:1fr;gap:20px;}
    .order-summary{order:-1;}
  }

  .co-section{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);padding:26px;margin-bottom:20px;}
  .co-section h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px;font-family:var(--mono);font-weight:600;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  @media(max-width:520px){.field-row{grid-template-columns:1fr;}}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px;}
  label .req{color:var(--accent-dark);}
  input[type="text"], input[type="email"], input[type="tel"], select{
    width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);
    font-size:14px;color:var(--ink);background:var(--paper-alt);transition:border-color .15s;appearance:none;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6862' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;background-size:16px;
  }
  input:focus, select:focus{outline:none;border-color:var(--accent-dark);}
  .field{margin-bottom:14px;}
  .phone-row{display:flex;gap:8px;}
  .phone-prefix{
    flex-shrink:0;width:64px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:var(--radius);font-size:13.5px;font-weight:600;color:var(--ink-soft);
  }
  .field-note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

  #express-checkout-element{margin-bottom:4px;}
  .express-divider{
    display:flex;align-items:center;gap:12px;margin:18px 0;
    font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;
  }
  .express-divider::before, .express-divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .express-divider.hidden{display:none;}

  .pay-btn{
    width:100%;background:var(--accent);color:#fff;font-weight:800;font-size:15px;
    padding:16px;border-radius:var(--radius-card);box-shadow:var(--shadow-cta);
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;
    transition:background 180ms ease, transform 180ms ease;
  }
  .pay-btn:hover{background:var(--accent-dark);}
  .pay-btn:active{transform:scale(.98);}
  .pay-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .pay-status{
    margin-top:12px;font-size:12.5px;text-align:center;color:var(--ink-soft);
    opacity:0;transition:opacity .2s;
  }
  .pay-status.show{opacity:1;}

  /* order summary */
  .order-summary{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);padding:24px;position:sticky;top:90px;z-index:40;}
  @media(max-width:900px){ .order-summary{position:static;top:auto;} }
  .order-summary h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px;font-family:var(--mono);font-weight:600;}
  .os-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .os-item .thumb{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);overflow:hidden;flex-shrink:0;background:var(--paper-alt);display:flex;align-items:center;justify-content:center;}
  .os-item .thumb img{width:100%;height:100%;object-fit:cover;}
  .os-item .meta{flex:1;font-size:12px;}
  .os-item .meta .pname{display:block;color:var(--ink-soft);font-size:11.5px;margin-bottom:2px;font-family:var(--mono);}
  .os-item .meta .promo-tag{display:block;color:#18352B;font-size:11px;font-weight:600;margin-top:4px;}
  .os-item .meta b{display:block;font-size:13.5px;font-weight:600;}
  .os-item .right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .qty-stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;}
  .qty-stepper button{width:24px;height:24px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .qty-stepper span{width:20px;text-align:center;font-size:12.5px;font-weight:700;font-family:var(--mono);}
  .os-price{font-weight:700;font-size:13px;white-space:nowrap;font-family:var(--mono);}
  .os-empty{font-size:13px;color:var(--ink-soft);padding:12px 0;}
  .os-empty a{color:var(--accent-dark);font-weight:700;text-decoration:underline;}
  .os-totals{margin-top:16px;}
  .os-totals .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:10px;}
  .os-totals .row.ship{color:var(--green);font-weight:700;display:flex;align-items:center;gap:5px;justify-content:flex-end;}
  .os-totals .row.ship .lbl{color:var(--ink-soft);font-weight:400;}
  .os-totals .row.total{font-weight:700;font-size:19px;color:var(--ink);margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--body);}
  .os-currency-note{text-align:right;font-size:11px;color:var(--ink-soft);margin-top:-4px;margin-bottom:14px;}
  .os-pay-icons{display:flex;justify-content:center;gap:6px;margin-top:16px;flex-wrap:wrap;}
  .pay-badge{
    display:flex;align-items:center;justify-content:center;
    height:26px;width:42px;border:1px solid var(--line);border-radius:6px;
    background:#fff;overflow:hidden;
  }
  .pay-badge svg{width:100%;height:100%;display:block;}
  .os-secure-line{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:10px;}
  .os-secure-line b{color:var(--accent-dark);font-weight:700;}
</style>
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.8c-2.1 0-3.2-1.9-2.3-3.7.4-.9 1.3-1.5 2.2-1.6.1-1.9 1.6-3.3 3.5-3.3.6 0 1.2.2 1.7.5C11.6 3.6 12.7 3 14 3c1.8 0 3.2 1.4 3.3 3.1.2 0 .4-.1.6-.1 1.9 0 3.5 1.6 3.5 3.5 0 .5-.1.9-.3 1.3.9.4 1.5 1.3 1.5 2.3 0 1.5-1.2 2.7-2.7 2.7H6Z"/><path d="M6.2 12.7V17c0 1.1.9 2 2 2h7.6c1.1 0 2-.9 2-2v-4.3"/><path d="M8.5 20.3c1.1.4 2.3.7 3.5.7s2.4-.3 3.5-.7"/></svg>
      </span>
      <span class="logo-text">
        <span class="the">The</span>
        <span class="cookery">Cookery</span>
      </span>
    </a>
    <div class="secure-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure Checkout
    </div>
  </div>
</header>

<main>
  <div class="checkout-grid">
    <div class="checkout-form">

      <div class="co-section">
        <h2>Customer information</h2>
        <div class="field">
          <label for="fullname">Full name <span class="req">*</span></label>
          <input type="text" id="fullname" placeholder="Jamie Taylor">
        </div>
        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email" placeholder="you@email.com">
        </div>
        <div class="field">
          <label for="phone">Phone <span class="req">*</span></label>
          <div class="phone-row">
            <div class="phone-prefix">+44</div>
            <input type="tel" id="phone" placeholder="7700 900123">
          </div>
          <p class="field-note">We'll text you delivery and order updates.</p>
        </div>
      </div>

      <div class="co-section">
        <h2>Delivery address</h2>
        <div class="field">
          <label for="country">Country / Region <span class="req">*</span></label>
          <select id="country"><option>United Kingdom</option></select>
        </div>
        <div class="field">
          <label for="postcode">Postcode <span class="req">*</span></label>
          <input type="text" id="postcode" placeholder="M1 1AE">
        </div>
        <div class="field">
          <label for="addr1">Address <span class="req">*</span></label>
          <input type="text" id="addr1" placeholder="10 Mayfield Road">
        </div>
        <div class="field">
          <label for="addr2">Apartment, floor, etc. (optional)</label>
          <input type="text" id="addr2" placeholder="Flat 4B, 2nd floor">
        </div>
        <div class="field">
          <label for="city">Town / City <span class="req">*</span></label>
          <input type="text" id="city" placeholder="Manchester">
        </div>
        <div class="field">
          <label for="county">County / Region</label>
          <input type="text" id="county" placeholder="Greater Manchester">
        </div>
      </div>

      <div class="co-section">
        <h2>Payment details</h2>
        <!-- Shows Apple Pay on iPhone/Safari and Google Pay on Android/Chrome
             automatically — Stripe handles device detection. -->
        <div id="express-checkout-element"></div>
        <p class="express-divider hidden" id="expressDivider">Or pay with card</p>

        <!-- Card fields, plus Link, mount here automatically. -->
        <div id="payment-element"></div>

        <button class="pay-btn" id="payBtn" type="button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span id="payBtnLabel">Pay £0.00</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <p class="pay-status" id="payStatus"></p>
      </div>

    </div>

    <aside class="order-summary">
      <h2>Order summary</h2>
      <div id="osItems"></div>
      <div class="os-totals">
        <div class="row"><span>Subtotal</span><span id="osSubtotal">£0.00</span></div>
        <div class="row ship"><span class="lbl">Shipping</span><span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:3px;"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Free</span></div>
        <div class="row total"><span>Total</span><span id="osTotal">£0.00</span></div>
      </div>
      <div class="os-currency-note">All charges in GBP (£)</div>
      <div class="os-pay-icons">
        <span class="pay-badge"><svg viewBox="0 0 52 34"><rect width="52" height="34" fill="#1434CB"/><text x="26" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-style="italic" font-size="14" fill="#fff">VISA</text></svg></span>
        <span class="pay-badge"><svg viewBox="0 0 52 34"><circle cx="22" cy="17" r="9" fill="#EB001B"/><circle cx="32" cy="17" r="9" fill="#F79E1B"/><path d="M27 10a9 9 0 0 1 0 14 9 9 0 0 1 0-14z" fill="#FF5F00"/></svg></span>
        <span class="pay-badge"><svg viewBox="0 0 52 34"><rect width="52" height="34" fill="#000"/><g transform="translate(9,10) scale(0.62)"><path d="M12.5 5.4c.7-.9 1.2-2 1-3.2-1 .1-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.1.1 2.3-.6 3.1-1.5z" fill="#fff"/><path d="M13.5 6.9c-1.7-.1-3.1 1-3.9 1-.8 0-2-1-3.3-.9-1.7 0-3.2 1-4.1 2.5-1.8 3-.5 7.5 1.2 10 .8 1.2 1.8 2.6 3.1 2.5 1.2 0 1.7-.8 3.2-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-3.9 0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-1.9z" fill="#fff"/></g><text x="24" y="21" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="13" fill="#fff">Pay</text></svg></span>
        <span class="pay-badge"><svg viewBox="0 0 52 34"><rect width="52" height="34" fill="#fff"/><text x="8" y="21" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12.5"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan><tspan fill="#5F6368"> Pay</tspan></text></svg></span>
      </div>
      <div class="os-secure-line">Secure payment with <b>Stripe</b></div>
    </aside>
  </div>
</main>

<script>
  // Safe to expose — starts with pk_. Never put the secret key (sk_) here.
  // ⚠️ SUBSTITUA pela chave publicável do SEU Stripe da The Cookery — a chave do GreatfindsUK foi removida.
  const STRIPE_PUBLISHABLE_KEY = 'pk_live_51U3JirFQ1fTz4zJF2dwED7mqPRR2DxM5dgVnXsOs96CvdT2CMqW2wUi6WEAiHGvNzsu5vVM3zfojsswGX1BGYo7000i4WJ4TJg';

  let stripe = null;
  let stripeReady = false;
  try {
    if (STRIPE_PUBLISHABLE_KEY && STRIPE_PUBLISHABLE_KEY.startsWith('pk_')) {
      stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
      stripeReady = true;
    }
  } catch (e) {
    console.error('Stripe failed to initialise:', e);
  }
  let elements = null;

  const PRODUCT_NAME = 'Hybrid Sauté Pan with Lid';

  // Preços exibidos aqui são só para o cliente ver — a Stripe SEMPRE recalcula
  // o valor real no servidor (api/create-payment-intent.js) usando esta mesma tabela,
  // então nunca confia no preço vindo da URL.
  const SIZE_PRICES = {
    "3 L": 39.00,
    "4.3 L": 49.00,
    "5 L": 69.00,
    "6.6 L": 90.00
  };
  const SIZE_IMAGES = {
    "3 L": "images/pan-3l-1.jpg",
    "4.3 L": "images/pan-4-3l-1.jpg",
    "5 L": "images/pan-5l-1.jpg",
    "6.6 L": "images/pan-6-6l-1.jpg"
  };

  // Promoção: 1ª unidade preço cheio, a 2ª tem 20% off — repete a cada par
  function calcLineTotal(unitPrice, qty){
    const pairs = Math.floor(qty / 2);
    const remainder = qty % 2;
    return (pairs * unitPrice * 1.8) + (remainder * unitPrice);
  }

  let cartItems = [];

  function getCartFromURL(){
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('cart');
    if(!raw) return [];
    try {
      const parsed = JSON.parse(decodeURIComponent(raw));
      // valida que cada item tem um tamanho conhecido, senão descarta
      return parsed.filter(item => SIZE_PRICES.hasOwnProperty(item.size) && item.qty > 0);
    } catch(e) { return []; }
  }

  function changeQty(idx, delta){
    cartItems[idx].qty = Math.max(1, Math.min(9, cartItems[idx].qty + delta));
    render();
    initPayment(); // amount changed, so the PaymentIntent needs to be recreated
  }

  function removeItem(idx){
    cartItems.splice(idx, 1);
    render();
    if(cartItems.length) initPayment();
  }

  function render(){
    const wrap = document.getElementById('osItems');
    const payBtn = document.getElementById('payBtn');

    if(!cartItems.length){
      wrap.innerHTML = '<p class="os-empty">Your basket is empty. <a href="index.html">Back to the store</a></p>';
      document.getElementById('osSubtotal').textContent = '£0.00';
      document.getElementById('osTotal').textContent = '£0.00';
      document.getElementById('payBtnLabel').textContent = 'Pay £0.00';
      payBtn.disabled = true;
      return;
    }

    wrap.innerHTML = cartItems.map((item, idx) => {
      const price = SIZE_PRICES[item.size];
      const img = SIZE_IMAGES[item.size];
      const lineTotal = calcLineTotal(price, item.qty);
      return `
      <div class="os-item">
        <div class="thumb"><img src="${img}" alt="${PRODUCT_NAME} — ${item.size}"></div>
        <div class="meta">
          <span class="pname">The Cookery · ${item.size}</span>
          <b>${PRODUCT_NAME}</b>
          ${item.qty >= 2 ? '<span class="promo-tag">2nd pan 20% off</span>' : ''}
        </div>
        <div class="right-col">
          <div class="qty-stepper">
            <button type="button" onclick="changeQty(${idx},-1)">−</button>
            <span>${item.qty}</span>
            <button type="button" onclick="changeQty(${idx},1)">+</button>
          </div>
          <div class="os-price">£${lineTotal.toFixed(2)}</div>
        </div>
      </div>`;
    }).join('');

    const subtotal = cartItems.reduce((sum, item) => sum + calcLineTotal(SIZE_PRICES[item.size], item.qty), 0);
    document.getElementById('osSubtotal').textContent = '£' + subtotal.toFixed(2);
    document.getElementById('osTotal').textContent = '£' + subtotal.toFixed(2);
    document.getElementById('payBtnLabel').textContent = 'Pay £' + subtotal.toFixed(2);
  }

  function setPayStatus(message, isError){
    const el = document.getElementById('payStatus');
    el.textContent = message;
    el.style.color = isError ? '#C0392B' : 'var(--ink-soft)';
    el.classList.add('show');
  }

  async function initPayment(){
    const payBtn = document.getElementById('payBtn');
    const mount = document.getElementById('payment-element');
    if(!cartItems.length) return;

    if(!stripeReady){
      mount.innerHTML = '';
      setPayStatus('Payment isn\'t set up yet — add your Stripe publishable key to enable checkout.', true);
      payBtn.disabled = true;
      return;
    }

    payBtn.disabled = true;
    mount.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);">Loading payment form…</p>';

    try {
      const res = await fetch('/api/create-payment-intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cartItems }),
      });
      if(!res.ok){
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Could not start payment');
      }
      const { clientSecret } = await res.json();

      mount.innerHTML = '';
      elements = stripe.elements({
        clientSecret,
        appearance: {
          theme: 'stripe',
          variables: {
            colorPrimary: '#18352B',
            colorBackground: '#FAF8F3',
            fontFamily: 'Inter, sans-serif',
            borderRadius: '3px',
            colorText: '#1C1C1A',
            colorTextSecondary: '#6B6862',
            colorDanger: '#C0392B',
          },
        },
      });
      const paymentElement = elements.create('payment');
      paymentElement.mount('#payment-element');

      const expressCheckoutElement = elements.create('expressCheckout', {
        buttonType: { applePay: 'buy', googlePay: 'buy' },
        buttonHeight: 48,
      });
      expressCheckoutElement.mount('#express-checkout-element');

      const expressDivider = document.getElementById('expressDivider');
      expressCheckoutElement.on('ready', ({ availablePaymentMethods }) => {
        if (!availablePaymentMethods) {
          document.getElementById('express-checkout-element').style.display = 'none';
          expressDivider.classList.add('hidden');
        } else {
          expressDivider.classList.remove('hidden');
        }
      });

      expressCheckoutElement.on('confirm', async (event) => {
        const { error } = await stripe.confirmPayment({
          elements,
          confirmParams: {
            return_url: window.location.origin + window.location.pathname + '?order=complete',
          },
        });
        if (error) {
          setPayStatus(error.message || 'Payment failed — please check your details and try again.', true);
        }
      });

      payBtn.disabled = false;
    } catch (err) {
      mount.innerHTML = '';
      setPayStatus(err.message || 'Payment form failed to load — check your Stripe keys are set.', true);
    }
  }

  async function handlePay(){
    if(!elements) return;
    const payBtn = document.getElementById('payBtn');
    const label = document.getElementById('payBtnLabel');
    const originalLabel = label.textContent;

    payBtn.disabled = true;
    label.textContent = 'Processing…';
    document.getElementById('payStatus').classList.remove('show');

    const { error } = await stripe.confirmPayment({
      elements,
      confirmParams: {
        return_url: window.location.origin + window.location.pathname + '?order=complete',
      },
    });

    // If we're still here, confirmation failed before any redirect
    // (e.g. card declined). Successful redirect-based methods navigate away.
    if (error) {
      setPayStatus(error.message || 'Payment failed — please check your details and try again.', true);
      payBtn.disabled = false;
      label.textContent = originalLabel;
    }
  }

  function checkPaymentRedirectResult(){
    if(!stripeReady) return;
    const params = new URLSearchParams(window.location.search);
    const clientSecret = params.get('payment_intent_client_secret');
    if(!clientSecret) return;

    stripe.retrievePaymentIntent(clientSecret).then(({ paymentIntent }) => {
      if(!paymentIntent) return;
      if(paymentIntent.status === 'succeeded'){
        setPayStatus('✅ Payment successful — thank you! A confirmation is on its way.', false);
      } else if(paymentIntent.status === 'processing'){
        setPayStatus('Your payment is processing — we will confirm shortly.', false);
      } else {
        setPayStatus('Payment was not completed. Please try again.', true);
      }
    });
  }

  document.getElementById('payBtn').addEventListener('click', handlePay);

  cartItems = getCartFromURL();
  render();
  checkPaymentRedirectResult();
  if(cartItems.length) initPayment();
</script>

</body>
</html>
